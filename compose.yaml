name: ku-med

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ku_med}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-ku_med}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: ku-med-migrate:local
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ku_med}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ku_med}?schema=public
      TZ: Asia/Bangkok
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ku-med:local
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_PROMPTPAY_ID: ${NEXT_PUBLIC_PROMPTPAY_ID:-}
        NEXT_PUBLIC_DEMO_DOCTOR_NAME: ${NEXT_PUBLIC_DEMO_DOCTOR_NAME:-}
        NEXT_PUBLIC_DEMO_MEDICAL_LICENSE: ${NEXT_PUBLIC_DEMO_MEDICAL_LICENSE:-}
        KUMED_BUILD_ID: ${KUMED_BUILD_ID:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ku_med}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ku_med}?schema=public
      TZ: Asia/Bangkok
      STUDENT_LOOKUP_MOCK: ${STUDENT_LOOKUP_MOCK:-false}
      STUDENT_LOOKUP_API_URL: ${STUDENT_LOOKUP_API_URL:-}
      STUDENT_LOOKUP_API_TOKEN: ${STUDENT_LOOKUP_API_TOKEN:-}
      CITIZEN_CARD_READER_MODE: ${CITIZEN_CARD_READER_MODE:-disabled}
      CITIZEN_CARD_READER_URL: ${CITIZEN_CARD_READER_URL:-}
      CITIZEN_CARD_READER_TOKEN: ${CITIZEN_CARD_READER_TOKEN:-}
      KU_ALLLOGIN_URL: ${KU_ALLLOGIN_URL:-}
      AUTH_EMAIL_MOCK: ${AUTH_EMAIL_MOCK:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SUPPORT_NAME: ${SUPPORT_NAME:-งานบริการผู้ใช้งาน สถานพยาบาลมหาวิทยาลัยเกษตรศาสตร์ วิทยาเขตกำแพงแสน}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-034-351611}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SUPPORT_HOURS: ${SUPPORT_HOURS:-วันจันทร์–ศุกร์ เวลา 08:30–16:30 น. (ยกเว้นวันหยุดราชการ)}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
