sonar.projectKey=ku-med
sonar.projectName=KU-MED
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

sonar.sources=src,scripts,prisma
sonar.inclusions=src/**/*.ts,src/**/*.tsx,src/**/*.css,scripts/**/*.mjs,prisma/**/*.prisma,prisma/migrations/**/*.sql
sonar.exclusions=src/generated/**,**/*.d.ts,**/node_modules/**,**/.next/**,**/coverage/**,**/public/**,**/*.log

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json

sonar.scm.provider=git
